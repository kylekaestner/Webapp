<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dispatch | Crowded Skies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.Geodesic/2.5.5/leaflet.geodesic.umd.min.js"></script>
    <style>
        .view-section { display: none; height: 100%; }
        .view-active { display: block; }

        /* Desktop: calendar grid — fixed-height cells, internal scroll per day */
        @media (min-width: 768px) {
            #view-grid.view-active { display: block !important; }
        }

        /* Mobile: compact grid + readable list */
        @media (max-width: 767px) {
            body { height: 100dvh !important; }
            /* Calendar grid: small colored tiles, tap for details */
            #view-grid { padding: 4px 2px !important; }
            #view-grid > div { gap: 2px !important; }
            #view-grid .col-span-7 { margin-bottom: 2px; font-size: 9px !important; }
            #calendar-grid-content > div {
                height: 44px !important;
                min-height: 0 !important;
                border-radius: 6px !important;
                cursor: pointer;
                overflow: hidden !important;
            }
            /* Hide flight list on mobile — tap cell to see details */
            #calendar-grid-content > div > div:last-child { display: none !important; }
            /* Compact header on mobile */
            #calendar-grid-content > div > div:first-child { padding: 3px 4px !important; }
            #calendar-grid-content .day-number { font-size: 12px !important; line-height: 1; }
            #calendar-grid-content span[class*="rounded-full"] { display: none !important; }
            /* List view: compact + wrap flight rows */
            #view-list { padding: 10px !important; }
            #calendar-list-content > div { padding: 10px !important; gap: 10px !important; }
            #calendar-list-content .w-16 { width: 48px !important; }
            .flight-row { padding-left: 8px !important; padding-right: 8px !important; }
            .flight-row .flex { flex-wrap: wrap !important; gap: 4px !important; }
            .flight-row .text-right { text-align: left !important; width: 100%; }
        }
        #sidebar { transition: width 0.22s ease, min-width 0.22s ease, opacity 0.18s ease; }
        #sidebar.sidebar-hidden { width: 0 !important; min-width: 0 !important; overflow: hidden; opacity: 0; border-right-width: 0 !important; }
        .nav-active { border-color: #3b82f6 !important; color: white !important; background: rgba(59, 130, 246, 0.1); }
        #map { height: 100%; width: 100%; background: #0a0a0a; }
        .map-controls { position: absolute; top: 20px; right: 20px; z-index: 1000; }
        .flight-row:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; margin-bottom: 8px; }
        .day-past { opacity: 0.55; }
        #calendar-list-content .list-past { filter: grayscale(30%) brightness(0.75); }
        .day-today { border-color: #38bdf8 !important; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3); }
        .day-today .day-number { color: #7dd3fc; }
        .dark-popup .leaflet-popup-content-wrapper { background: #0f172a; color: #f8fafc; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.8); }
        .dark-popup .leaflet-popup-tip { background: #0f172a; }
        .dark-popup .leaflet-popup-content { margin: 12px 14px; }
        @keyframes plane-pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); } 70% { box-shadow: 0 0 0 14px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
        .plane-dot { width: 14px; height: 14px; border-radius: 50%; background: #22c55e; border: 2px solid #fff; animation: plane-pulse 1.6s ease-out infinite; }
        @keyframes here-pulse { 0% { box-shadow: 0 0 0 0 rgba(168,85,247,0.7); } 70% { box-shadow: 0 0 0 16px rgba(168,85,247,0); } 100% { box-shadow: 0 0 0 0 rgba(168,85,247,0); } }
        .here-dot { width: 16px; height: 16px; border-radius: 50%; background: #a855f7; border: 2px solid #fff; animation: here-pulse 2s ease-out infinite; }
    </style>
</head>
<body class="bg-[#050505] text-zinc-100 flex h-screen overflow-hidden font-sans">

    <div id="sidebar" class="hidden md:flex w-64 border-r border-zinc-800 bg-zinc-900/20 flex-col shrink-0">
        <div class="p-6 border-b border-zinc-800 text-center">
            <h1 class="text-blue-500 font-black italic text-xl tracking-tighter uppercase">Crowded Skies</h1>
        </div>
        
        <div class="p-4 space-y-1">
            <p class="text-[10px] font-black text-zinc-600 uppercase px-2 mb-2">Navigation</p>
            <button onclick="switchView('grid')" id="btn-grid" class="nav-active w-full text-left p-3 rounded-xl border border-zinc-800 transition-all text-sm font-bold text-zinc-400 hover:text-white">📅 Calendar Grid</button>
            <button onclick="switchView('list')" id="btn-list" class="w-full text-left p-3 rounded-xl border border-zinc-800 transition-all text-sm font-bold text-zinc-400 hover:text-white">📜 List View</button>
            <button onclick="switchView('map')" id="btn-map" class="w-full text-left p-3 rounded-xl border border-zinc-800 transition-all text-sm font-bold text-zinc-400 hover:text-white">🗺️ Route Map</button>
        </div>

        <div class="p-4 space-y-1 mt-4">
            <p class="text-[10px] font-black text-zinc-600 uppercase px-2 mb-2">Crew Selection</p>
            <button onclick="loadPilot('kyle')" id="pilot-kyle" class="w-full text-left p-4 rounded-xl border border-zinc-800 hover:border-blue-500 transition-colors">
                <span class="text-[9px] block text-zinc-500 font-black uppercase">Kyle</span>
                <span class="font-bold text-sm tracking-tight">Kyle Kaestner</span>
            </button>
            <button onclick="loadPilot('adam')" id="pilot-adam" class="w-full text-left p-4 rounded-xl border border-zinc-800 hover:border-blue-500 transition-colors">
                <span class="text-[9px] block text-zinc-500 font-black uppercase">Adam</span>
                <span class="font-bold text-sm tracking-tight">Adam Burke</span>
            </button>
            <button onclick="loadPilot('sam')" id="pilot-sam" class="w-full text-left p-4 rounded-xl border border-zinc-800 hover:border-blue-500 transition-colors">
                <span class="text-[9px] block text-zinc-500 font-black uppercase">Sam</span>
                <span class="font-bold text-sm tracking-tight">Sam Byrne</span>
            </button>
            <button onclick="loadPilot('logan')" id="pilot-logan" class="w-full text-left p-4 rounded-xl border border-zinc-800 hover:border-blue-500 transition-colors">
                <span class="text-[9px] block text-zinc-500 font-black uppercase">Logan</span>
                <span class="font-bold text-sm tracking-tight">Logan Hine</span>
            </button>
        </div>

        <div class="mt-auto p-4 border-t border-zinc-800 bg-black/20 space-y-3">
            <div class="space-y-2">
                <label class="text-[10px] font-black text-zinc-600 uppercase px-2 block">Upload For</label>
                <select id="upload-pilot-select" class="w-full p-2 rounded-lg border border-zinc-700 bg-zinc-900 text-sm font-bold text-zinc-100 hover:border-blue-500 transition">
                    <option value="kyle">Kyle Kaestner</option>
                    <option value="adam">Adam Burke</option>
                    <option value="sam">Sam Byrne</option>
                    <option value="logan">Logan Hine</option>
                </select>
            </div>
            <input type="file" id="file-input" class="hidden" onchange="handleUpload(this)">
            <button onclick="document.getElementById('file-input').click()" class="w-full py-3 border border-zinc-800 hover:border-blue-500 text-zinc-500 hover:text-blue-400 rounded-xl transition text-[10px] font-black uppercase text-center">Upload Schedule</button>
        </div>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden min-w-0">
        <!-- Desktop header -->
        <header class="hidden md:flex h-20 border-b border-zinc-800 items-center justify-between px-8 bg-black/40 backdrop-blur-md shrink-0">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" id="hamburger-btn" title="Toggle sidebar" class="flex flex-col items-center justify-center gap-[5px] w-9 h-9 rounded-xl hover:bg-zinc-800 transition-colors group shrink-0">
                    <span class="w-5 h-[2px] bg-zinc-500 group-hover:bg-zinc-200 transition-colors rounded-full"></span>
                    <span class="w-5 h-[2px] bg-zinc-500 group-hover:bg-zinc-200 transition-colors rounded-full"></span>
                    <span class="w-5 h-[2px] bg-zinc-500 group-hover:bg-zinc-200 transition-colors rounded-full"></span>
                </button>
                <div class="flex flex-col">
                    <h2 id="pilot-header" class="font-black uppercase tracking-widest text-xs text-zinc-400 italic">Dispatch</h2>
                    <div class="text-2xl font-black italic tracking-tighter text-white uppercase" id="current-month-display">May 2026</div>
                </div>
                <div class="flex items-center bg-zinc-900/50 p-1 rounded-xl border border-zinc-800">
                    <button onclick="changeMonth(-1)" class="px-4 py-2 rounded-lg text-[10px] font-black uppercase bg-zinc-800 hover:bg-zinc-700">Prev</button>
                    <button onclick="changeMonth(1)" class="px-4 py-2 rounded-lg text-[10px] font-black uppercase bg-zinc-800 hover:bg-zinc-700 ml-1">Next</button>
                </div>
            </div>
        </header>

        <!-- Mobile header -->
        <header class="md:hidden border-b border-zinc-800 flex items-end justify-between px-4 bg-black/60 backdrop-blur-md shrink-0" style="height: calc(56px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); padding-bottom: 10px;">
            <div class="flex flex-col leading-tight">
                <span id="pilot-header-mobile" class="text-[9px] font-black uppercase tracking-widest text-zinc-500 italic">Dispatch</span>
                <span id="current-month-display-mobile" class="text-base font-black italic tracking-tighter text-white uppercase">May 2026</span>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="changeMonth(-1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-zinc-800 text-zinc-300 font-black text-sm">‹</button>
                <button onclick="changeMonth(1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-zinc-800 text-zinc-300 font-black text-sm">›</button>
            </div>
        </header>

        <!-- Mobile pilot selector bar -->
        <div class="md:hidden flex gap-2 px-3 py-2 bg-zinc-950 border-b border-zinc-800 shrink-0 overflow-x-auto">
            <button onclick="loadPilot('kyle')" id="mpilot-kyle" class="mpilot-btn flex-none px-4 py-1.5 rounded-full border border-zinc-700 text-xs font-black text-zinc-400 whitespace-nowrap">Kyle</button>
            <button onclick="loadPilot('adam')" id="mpilot-adam" class="mpilot-btn flex-none px-4 py-1.5 rounded-full border border-zinc-700 text-xs font-black text-zinc-400 whitespace-nowrap">Adam</button>
            <button onclick="loadPilot('sam')" id="mpilot-sam" class="mpilot-btn flex-none px-4 py-1.5 rounded-full border border-zinc-700 text-xs font-black text-zinc-400 whitespace-nowrap">Sam</button>
            <button onclick="loadPilot('logan')" id="mpilot-logan" class="mpilot-btn flex-none px-4 py-1.5 rounded-full border border-zinc-700 text-xs font-black text-zinc-400 whitespace-nowrap">Logan</button>
        </div>

        <main class="flex-1 overflow-hidden relative bg-black">
            <div id="view-grid" class="view-section view-active overflow-y-auto p-3">
                <div class="w-full grid grid-cols-7 gap-2">
                    <div class="col-span-7 grid grid-cols-7 text-center text-[9px] font-black uppercase tracking-widest text-zinc-600 mb-1">
                        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
                    </div>
                    <div id="calendar-grid-content" class="contents"></div>
                </div>
            </div>

            <div id="view-list" class="view-section overflow-y-auto p-6">
                <div id="calendar-list-content" class="max-w-3xl mx-auto space-y-4 pb-20"></div>
            </div>

            <div id="view-map" class="view-section relative">
                <div id="map"></div>
                <div class="map-controls flex flex-col gap-2">
                    <button onclick="toggleMapFilter('past')" id="btn-past" class="px-4 py-2 bg-zinc-800 border border-zinc-600 rounded-lg text-[10px] font-black uppercase text-white hover:bg-zinc-700">Toggle Past (Gray)</button>
                    <button onclick="toggleMapFilter('future')" id="btn-future" class="px-4 py-2 bg-blue-600 border border-blue-400 rounded-lg text-[10px] font-black uppercase text-white hover:bg-blue-500">Toggle Future (Blue)</button>
                </div>
            </div>
        </main>

        <!-- Mobile bottom nav -->
        <nav class="md:hidden border-t border-zinc-800 bg-zinc-950/95 backdrop-blur-md flex items-stretch shrink-0" style="height: calc(60px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);">
            <button onclick="switchView('grid')" id="mbtn-grid" class="mbtn flex-1 flex flex-col items-center justify-center gap-0.5 text-zinc-500 transition-colors">
                <span class="text-lg leading-none">📅</span><span class="text-[9px] font-black uppercase tracking-wide">Grid</span>
            </button>
            <button onclick="switchView('list')" id="mbtn-list" class="mbtn flex-1 flex flex-col items-center justify-center gap-0.5 text-zinc-500 transition-colors">
                <span class="text-lg leading-none">📋</span><span class="text-[9px] font-black uppercase tracking-wide">List</span>
            </button>
            <button onclick="switchView('map')" id="mbtn-map" class="mbtn flex-1 flex flex-col items-center justify-center gap-0.5 text-zinc-500 transition-colors">
                <span class="text-lg leading-none">🗺️</span><span class="text-[9px] font-black uppercase tracking-wide">Map</span>
            </button>
            <button onclick="document.getElementById('mobile-upload-pilot-select').value=currentPilot||'kyle';document.getElementById('mobile-upload-sheet').classList.remove('hidden')" class="mbtn flex-1 flex flex-col items-center justify-center gap-0.5 text-zinc-500 transition-colors">
                <span class="text-lg leading-none">⬆️</span><span class="text-[9px] font-black uppercase tracking-wide">Upload</span>
            </button>
        </nav>
    </div>

    <!-- Mobile day detail sheet -->
    <div id="day-detail-sheet" class="hidden fixed inset-0 z-50 flex items-end md:hidden" onclick="if(event.target===this)this.classList.add('hidden')">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
        <div class="relative w-full bg-zinc-900 border-t border-zinc-700 rounded-t-2xl max-h-[78vh] flex flex-col" onclick="event.stopPropagation()">
            <div class="w-10 h-1 bg-zinc-700 rounded-full mx-auto mt-3 mb-1 shrink-0"></div>
            <div id="day-detail-content" class="overflow-y-auto px-5 pb-6 pt-2"></div>
        </div>
    </div>

    <!-- Mobile upload sheet -->
    <div id="mobile-upload-sheet" class="hidden fixed inset-0 z-50 flex items-end md:hidden" onclick="if(event.target===this)this.classList.add('hidden')">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="relative w-full bg-zinc-900 border-t border-zinc-700 rounded-t-2xl p-6 space-y-4">
            <div class="w-10 h-1 bg-zinc-600 rounded-full mx-auto mb-2"></div>
            <h3 class="text-sm font-black uppercase tracking-widest text-zinc-400 text-center">Upload Schedule</h3>
            <div class="space-y-2">
                <label class="text-[10px] font-black text-zinc-500 uppercase block">Upload For</label>
                <select id="mobile-upload-pilot-select" class="w-full p-3 rounded-xl border border-zinc-700 bg-zinc-800 text-sm font-bold text-zinc-100">
                    <option value="kyle">Kyle Kaestner</option>
                    <option value="adam">Adam Burke</option>
                    <option value="sam">Sam Byrne</option>
                    <option value="logan">Logan Hine</option>
                </select>
            </div>
            <input type="file" id="mobile-file-input" class="hidden" onchange="handleMobileUpload(this)">
            <button onclick="document.getElementById('mobile-file-input').click()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-black uppercase text-sm tracking-wide transition">Choose File</button>
            <button onclick="document.getElementById('mobile-upload-sheet').classList.add('hidden')" class="w-full py-3 border border-zinc-700 text-zinc-400 rounded-xl font-black uppercase text-xs tracking-wide">Cancel</button>
        </div>
    </div>

            const cosDelta = Math.sin(lat1) * Math.sin(lat2) + Math.cos(lat1) * Math.cos(lat2) * Math.cos(dLon);
            const delta = Math.acos(Math.min(1, Math.max(-1, cosDelta)));
            if (delta === 0) return [[start[0], start[1]], [end[0], end[1]]];
            const path = [];
            for (let i = 0; i <= steps; i++) {
                const f = i / steps;
                const A = Math.sin((1 - f) * delta) / Math.sin(delta);
                const B = Math.sin(f * delta) / Math.sin(delta);
                const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
                const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
                const z = A * Math.sin(lat1) + B * Math.sin(lat2);
                const lat = Math.atan2(z, Math.sqrt(x * x + y * y));

                mapLayers.labels.push(label);

                airportVisibilityMap[upper] = { past, future, marker: point, label };
            });

            // Current position pin
            const home = PILOT_HOMES[currentPilot] || null;
            const allFlightsSorted = allFlights.slice().sort((a, b) => new Date(a.departureTime) - new Date(b.departureTime));
            const isAirborne = allFlightsSorted.some(f => f.departureTime && f.arrivalTime && new Date(f.departureTime) <= now && now <= new Date(f.arrivalTime));
            if (!isAirborne) {
                const completedFlights = allFlightsSorted.filter(f => f.arrivalTime && new Date(f.arrivalTime) <= now);
                const lastArrival = completedFlights.length > 0
                    ? completedFlights[completedFlights.length - 1].arrivalAirport
                    : null;
                const atBase = lastArrival && pilotBase && lastArrival.toUpperCase() === pilotBase.toUpperCase();
                const locationCode = (!lastArrival || atBase) ? home : lastArrival;
                const locationCoords = locationCode ? resolveAirport(locationCode) : null;
                if (locationCoords) {
                    const isAtHome = !lastArrival || atBase || (home && locationCode && locationCode.toUpperCase() === home.toUpperCase());
                    const label = isAtHome ? 'Home' : locationCode;
                    const pilotName = pilotsCache[currentPilot]?.name?.split(' ')[0] || currentPilot;
                    const pin = L.marker(locationCoords, {
                        icon: L.divIcon({
                            className: '',
                            html: `<div class="here-dot"></div>`,
                            iconAnchor: [8, 8]
                        }),
                        zIndexOffset: 2000
                    }).bindPopup(
                        `<div style="font-weight:900;font-size:13px;color:#f8fafc;margin-bottom:4px">${pilotName} is here</div>
                         <div style="font-size:12px;color:#c4b5fd">${locationCode}${isAtHome ? ' · Home' : ' · Layover'}</div>`,
                        { className: 'dark-popup' }
                    ).addTo(map);
                    const hereLabel = L.marker(locationCoords, {
                        icon: L.divIcon({
                            className: '',
                            html: `<div style="color:#d8b4fe;font-size:10px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,0.9);transform:translate(-50%,8px);white-space:nowrap">${label}</div>`,
                            iconAnchor: [0, 0]
                        })
                    }).addTo(map);
                    mapLayers.active.push(pin, hereLabel);
                }
            }

            if (bounds.length > 0) map.fitBounds(L.latLngBounds(bounds).pad(0.2));
        }

            }

        // Tooltip element for flight details
        const tooltip = document.createElement('div');

        Object.assign(tooltip.style, { position: 'fixed', pointerEvents: 'none', background: '#0b1220', color: '#fff', padding: '8px 10px', borderRadius: '8px', boxShadow: '0 4px 18px rgba(2,6,23,0.8)', fontSize: '12px', zIndex: 2000, display: 'none', maxWidth: '260px' });
        document.body.appendChild(tooltip);

        function positionTooltip(x, y) {
            const tw = tooltip.offsetWidth;
            const th = tooltip.offsetHeight;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const offset = 14;
            let tx = x + offset;
            let ty = y + offset;
            if (tx + tw > vw - 8) tx = x - tw - offset;
            if (ty + th > vh - 8) ty = y - th - offset;
            if (tx < 8) tx = 8;
            if (ty < 8) ty = 8;
            tooltip.style.left = tx + 'px';
            tooltip.style.top = ty + 'px';
        }
        function showTooltip(html, x, y) {
            tooltip.innerHTML = html;
            tooltip.style.display = 'block';
            positionTooltip(x, y);

        function formatTimeISO(iso) {
            if (!iso) return '—';
            try {
                const d = new Date(iso);
                if (isNaN(d.getTime())) return '—';
                return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return '—';
            }
        }
        function formatDurationMinutes(mins) {
            if (mins <= 0 || !isFinite(mins)) return '—';
            const h = Math.floor(mins / 60); const m = Math.round(mins % 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        function attachTooltips() {
            document.querySelectorAll('.flight-item').forEach(el => {

                    const depApt = el.dataset.depApt || '';

                    const depDate = dep ? new Date(dep) : null;
                    const arrDate = arr ? new Date(arr) : null;
                    const blockMins = (depDate && arrDate && !isNaN(depDate.getTime()) && !isNaN(arrDate.getTime())) ? (arrDate - depDate) / 60000 : null;

                    // compute ground time to next connecting leg
                    let layoverText = '';
                    try {
                        const pilotBase = pilotsCache[currentPilot]?.base || null;
                        if (arrDate && arrApt && arrApt !== pilotBase) {
                            const nextLeg = segments.filter(s => s.type === 'flight' && s.departureAirport === arrApt && new Date(s.departureTime) > arrDate)
                                .sort((a, b) => new Date(a.departureTime) - new Date(b.departureTime))[0];
                            if (nextLeg) {
                                const groundMins = (new Date(nextLeg.departureTime) - arrDate) / 60000;
                                if (groundMins > 0) {
                                    const label = groundMins < 240 ? 'Turn' : 'Layover';
                                    layoverText = `${label} ${formatDurationMinutes(groundMins)}`;
                                }
                            }
                        }
                    } catch (er) { layoverText = ''; }

                    const dhLabel = el.dataset.dh === 'true' ? `<div style="font-size:11px;color:#f9a8d4;font-weight:700;margin-bottom:4px">DH Flight</div>` : '';
                    const html = `<div style="font-weight:800;margin-bottom:6px">${depApt} → ${arrApt} ${flightNum ? `<span style=\"font-weight:600;color:#9fb8ff;margin-left:6px\">${flightNum}</span>` : (trip ? `<span style=\"font-weight:600;color:#9fb8ff;margin-left:6px\">Trip ${trip}</span>` : '')}</div>` +
                        dhLabel +

                    showTooltip(html, e.clientX, e.clientY);

                function onMove(e) { moveTooltip(e.clientX, e.clientY); }
                function onLeave() { hideTooltip(); }
                el.removeEventListener('mouseenter', el._enter);
                el.removeEventListener('mousemove', el._move);
                el.removeEventListener('mouseleave', el._leave);
                el._enter = onEnter; el._move = onMove; el._leave = onLeave;

        // --- Parsers (client-side) ---
        function parseICS(text) {
            const events = [];
            const blocks = text.split(/BEGIN:VEVENT/gi).slice(1);
            for (const b of blocks) {
                const lines = b.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                const getLine = (prefix) => {
                    const ln = lines.find(l => l.toUpperCase().startsWith(prefix));
                    return ln ? ln.split(/:(.+)/)[1] || '' : '';
                };
                const rawDTSTART = lines.find(l => l.toUpperCase().startsWith('DTSTART')) || '';
                const isAllDay = /VALUE=DATE/i.test(rawDTSTART);
                const dtstart = rawDTSTART.split(/:(.+)/)[1] || '';
                const dtend = (lines.find(l => l.toUpperCase().startsWith('DTEND')) || '').split(/:(.+)/)[1] || '';
                const summary = getLine('SUMMARY') || '';
                const desc = getLine('DESCRIPTION') || '';

                if (/^HARD$/i.test(summary) || isAllDay) {
                    // hard day off
                    const date = isAllDay ? dtstart : dtstart.substring(0,8);
                    const y = date.substring(0,4), m = date.substring(4,6), d = date.substring(6,8);
                    events.push({ type: 'hard', departureTime: `${y}-${m}-${d}T00:00:00` });
                    continue;
                }

                if (/^AWAY$/i.test(summary)) {
                    // away with DESCRIPTION maybe 'AWAY - APC'
                    const arrival = (desc.match(/AWAY\s*-\s*(\w+)/i) || [])[1] || null;
                    if (dtstart) {
                        const isoStart = formatICSDatetime(dtstart);
                        const isoEnd = dtend ? formatICSDatetime(dtend) : '';
                        events.push({ type: 'away', departureTime: isoStart, arrivalTime: isoEnd, arrivalAirport: arrival });
                    }
                    continue;
                }

                // flight events: SUMMARY like '✈️ KSUS -> TJSJ' or '✈️ KCNY -> KSUS'
                const flightMatch = summary.match(/(?:✈️|\u2708)?\s*([A-Z0-9]{3,4})\s*(?:->|→|–|—|-|to)\s*([A-Z0-9]{3,4})/i);
                const tailMatch = desc.match(/Tail:\s*([A-Z0-9]+)/i);
                const tripMatch = desc.match(/Trip\s*[:#]?\s*(\d+)/i);
                // try to capture flight number like RPA1234 or SKW567
                const flightNumMatch = desc.match(/(?:Flight|Flt|FLT)\s*[:#]?\s*([A-Z]{2,3}\d{1,4})/i) || desc.match(/\b([A-Z]{2,3}\d{1,4})\b/i);
                if (flightMatch) {
                    const dep = flightMatch[1];
                    const arr = flightMatch[2];
                    const isoStart = dtstart ? formatICSDatetime(dtstart) : '';
                    const isoEnd = dtend ? formatICSDatetime(dtend) : '';
                    events.push({
                        type: 'flight',
                        departureTime: isoStart,
                        arrivalTime: isoEnd,
                        departureAirport: dep,
                        arrivalAirport: arr,
                        tail: tailMatch ? tailMatch[1] : '',
                        trip: tripMatch ? tripMatch[1] : '',
                        flightNumber: (flightNumMatch && flightNumMatch[1] && !/^N/i.test(flightNumMatch[1])) ? flightNumMatch[1].toUpperCase() : ''
                    });
                }
            }
            return events;
        }

        function formatICSDatetime(s) {
            // s like 20260430T120000Z or 20260501
            if (/^\d{8}T\d{6}Z$/.test(s)) {
                const y = s.substring(0,4), m = s.substring(4,6), d = s.substring(6,8);
                const hh = s.substring(9,11), mm = s.substring(11,13), ss = s.substring(13,15);
                return `${y}-${m}-${d}T${hh}:${mm}:${ss}Z`;
            }
            if (/^\d{8}$/.test(s)) {
                const y = s.substring(0,4), m = s.substring(4,6), d = s.substring(6,8);
                return `${y}-${m}-${d}T00:00:00`;
            }
            return s;
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            const header = lines.shift().split(',').map(h => h.trim());
            const idx = (name) => header.indexOf(name);
            const events = [];

            const toMinutes = (time) => {
                const txt = normalizeTime(time);
                const [hh, mm] = txt.split(':').map(Number);
                return hh * 60 + mm;
            };

            const addDays = (year, month, day, extraDays) => {
                const d = new Date(Number(year), Number(month) - 1, Number(day) + extraDays);
                const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
                return { y, m, dd };
            };

            for (const row of lines) {
                const cols = row.split(',');
                const date = cols[idx('DATE')]?.trim();
                const dh = cols[idx('DH')]?.trim();
                const tail = (cols[idx('FCVTAIL')] || cols[idx('TAIL')] || '').trim();
                const dep = (cols[idx('DEP')] || '').trim();
                const arr = (cols[idx('ARR')] || '').trim();
                const deptime = (cols[idx('DEPTIME')] || '').trim();
                const arrtime = (cols[idx('ARRTIME')] || '').trim();

                if (!date) continue;
                const [m, d, y] = date.split('/');
                const ym = y.padStart(4, '0'), mm = m.padStart(2, '0'), dd = d.padStart(2, '0');

                if (dep && arr) {
                    const dt = normalizeTime(deptime);
                    const at = normalizeTime(arrtime);
                    let arrivalDate = { y: ym, m: mm, dd: dd };
                    const depMinutes = toMinutes(deptime);
                    const arrMinutes = toMinutes(arrtime);
                    if (arrMinutes <= depMinutes) {
                        arrivalDate = addDays(ym, mm, dd, 1);
                    }
                    const isoStart = `${ym}-${mm}-${dd}T${dt}:00`;
                    const isoEnd = `${arrivalDate.y}-${arrivalDate.m}-${arrivalDate.dd}T${at}:00`;
                    const isDH = dh && dh.toUpperCase() === 'DH';
                    events.push({ type: 'flight', departureTime: isoStart, arrivalTime: isoEnd, departureAirport: dep, arrivalAirport: arr, tail, dh: isDH });
                    continue;
                }

                if (dh && dh.toUpperCase() === 'DH') {
                    const isoDate = `${ym}-${mm}-${dd}T00:00:00`;
                    events.push({ type: 'hard', departureTime: isoDate });
                    continue;
                }
            }
            return events;
        }

        // Flexible CSV parser variant for SkyWest-style exports (handles varied header names)
        function parseCSV_skywest(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            if (lines.length === 0) return [];
            const headerRaw = lines.shift();
            const header = headerRaw.split(',').map(h => h.trim().toUpperCase());

            const findIdx = (aliases) => {
                for (const a of aliases) {
                    const up = a.toUpperCase();
                    const i = header.indexOf(up);
                    if (i >= 0) return i;
                }
                return -1;
            };

            const idxDate = findIdx(['DATE','FLIGHTDATE','SCHEDULEDATE']);
            const idxDep = findIdx(['DEP','DEPARTURE','ORIG','ORIGIN','FROM']);
            const idxArr = findIdx(['ARR','ARRIVAL','DEST','DESTINATION','TO']);
            const idxDepTime = findIdx(['DEPTIME','DEP_TIME','DEPARTURETIME','DEP TIME','DEP/TIME','DEPT']);
            const idxArrTime = findIdx(['ARRTIME','ARR_TIME','ARRIVALTIME','ARR TIME','ARR/TIME','ARRT']);
            const idxTail = findIdx(['FCVTAIL','TAIL','AIRCRAFT','REGISTRATION']);
            const idxDh = findIdx(['DH','DUTY','IS_DH']);

            const events = [];

            const toMinutes = (time) => {
                if (!time) return 0;
                const norm = normalizeTime(time.replace(/"/g, '').trim());
                const [hh, mm] = norm.split(':').map(Number);
                return hh * 60 + mm;
            };

            const addDays = (year, month, day, extraDays) => {
                const d = new Date(Number(year), Number(month) - 1, Number(day) + extraDays);
                const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
                return { y, m, dd };
            };

            for (const row of lines) {
                const cols = row.split(',');
                const date = idxDate >= 0 ? (cols[idxDate] || '').replace(/"/g,'').trim() : '';
                const dep = idxDep >= 0 ? (cols[idxDep] || '').replace(/"/g,'').trim() : '';
                const arr = idxArr >= 0 ? (cols[idxArr] || '').replace(/"/g,'').trim() : '';
                const deptime = idxDepTime >= 0 ? (cols[idxDepTime] || '').replace(/"/g,'').trim() : '';
                const arrtime = idxArrTime >= 0 ? (cols[idxArrTime] || '').replace(/"/g,'').trim() : '';
                const tail = idxTail >= 0 ? (cols[idxTail] || '').replace(/"/g,'').trim() : '';
                const dh = idxDh >= 0 ? (cols[idxDh] || '').replace(/"/g,'').trim() : '';

                if (!date) continue;

                // Accept formats like MM/DD/YYYY or YYYY-MM-DD
                let ym = '', mm = '', dd = '';
                if (/\d{1,2}\/\d{1,2}\/\d{2,4}/.test(date)) {
                    const parts = date.split('/');
                    mm = String(parts[0]).padStart(2,'0'); dd = String(parts[1]).padStart(2,'0'); ym = String(parts[2]).padStart(4,'0');
                } else if (/\d{4}-\d{2}-\d{2}/.test(date)) {
                    const parts = date.split('-'); ym = parts[0]; mm = parts[1]; dd = parts[2];
                } else {
                    // fallback: try to parse with Date
                    const d = new Date(date);
                    if (isNaN(d)) continue;
                    ym = d.getFullYear(); mm = String(d.getMonth()+1).padStart(2,'0'); dd = String(d.getDate()).padStart(2,'0');
                }

                if (dep && arr) {
                    const dt = normalizeTime(deptime);
                    const at = normalizeTime(arrtime);
                    let arrivalDate = { y: ym, m: mm, dd: dd };
                    const depMinutes = toMinutes(deptime);
                    const arrMinutes = toMinutes(arrtime);
                    if (arrMinutes <= depMinutes) arrivalDate = addDays(ym, mm, dd, 1);
                    const isoStart = `${ym}-${mm}-${dd}T${dt}:00`;
                    const isoEnd = `${arrivalDate.y}-${arrivalDate.m}-${arrivalDate.dd}T${at}:00`;
                    const isDH = dh && (dh.toUpperCase() === 'DH' || dh === '1' || dh.toLowerCase() === 'true');
                    events.push({ type: 'flight', departureTime: isoStart, arrivalTime: isoEnd, departureAirport: dep, arrivalAirport: arr, tail, dh: isDH });
                    continue;
                }

                if (dh && dh.toUpperCase() === 'DH') {
                    const isoDate = `${ym}-${mm}-${dd}T00:00:00`;
                    events.push({ type: 'hard', departureTime: isoDate });
                    continue;
                }
            }

            return events;
        }

        function normalizeTime(t) {
            if (!t) return '00:00';
            const txt = t.trim().replace(/[^\d:]/g, '');
            if (txt.includes(':')) {
                const parts = txt.split(':');
                const hh = String(parts[0] || '00').padStart(2, '0').slice(-2);
                const mm = String(parts[1] || '00').padStart(2, '0').slice(-2);
                return `${hh}:${mm}`;
            }
            const s = txt.padStart(4, '0');
            return `${s.slice(0, 2)}:${s.slice(2, 4)}`;
        }

        async function handleUpload(input) {
            if (!input.files[0]) return;
            
            const file = input.files[0];
            // Get selected pilot from dropdown
            const uploadPilot = document.getElementById('upload-pilot-select').value;
            
            console.log(`Uploading ${file.name} for pilot ${uploadPilot}...`);
            
            const result = await uploadPilotSchedule(uploadPilot, file);
            
            if (result && result.success) {
                alert(`Successfully uploaded ${result.segmentsAdded} segments for ${uploadPilot}`);
                // If the uploaded pilot is currently viewed, reload their data
                if (uploadPilot === currentPilot) {
                    loadPilot(currentPilot);
                }
            } else {
                alert('Upload failed. Check console for details.');
            }
            
            // Reset input
            input.value = '';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('sidebar-hidden');
        }

        function showDayDetail(dateKey) {
            if (window.innerWidth >= 768) return;
            const pilotBase = pilotsCache[currentPilot]?.base || null;
            const dayEvents = segments.filter(s => s.departureTime && s.departureTime.startsWith(dateKey));
            const [yr, mo, dy] = dateKey.split('-');
            const dateObj = new Date(parseInt(yr), parseInt(mo) - 1, parseInt(dy));
            const dateLabel = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

            const isHard = dayEvents.some(e => e.type === 'hard');
            let away = dayEvents.find(e => e.type === 'away');
            if (away && pilotBase && away.arrivalAirport === pilotBase) away = null;
            const flights = dayEvents.filter(e => e.type === 'flight').sort((a, b) => new Date(a.departureTime) - new Date(b.departureTime));

            let label = currentPilot === 'kyle' ? 'ON CALL' : 'OFF';
            let labelColor = 'text-zinc-400';
            if (isHard) { label = 'HARD OFF'; labelColor = 'text-red-400'; }
            else if (away) { label = `AWAY — ${away.arrivalAirport}`; labelColor = 'text-amber-400'; }
            else if (flights.length > 0) { label = 'FLYING'; labelColor = 'text-blue-400'; }

            let html = `<div class="flex items-start justify-between mb-4">
                <div>
                    <div class="text-[10px] font-black uppercase tracking-widest ${labelColor}">${label}</div>
                    <div class="text-lg font-black text-white mt-0.5">${dateLabel}</div>
                </div>
                <button onclick="document.getElementById('day-detail-sheet').classList.add('hidden')" class="w-8 h-8 flex items-center justify-center rounded-full bg-zinc-800 text-zinc-400 text-sm shrink-0">✕</button>
            </div>`;

            if (flights.length === 0) {
                const icon = isHard ? '🔴' : away ? '🏨' : '😴';
                const msg = isHard ? 'Hard Day Off' : away ? `Away at ${away.arrivalAirport}` : 'Day Off';
                html += `<div class="text-center py-8"><div class="text-3xl mb-2">${icon}</div><div class="text-sm font-bold text-zinc-400">${msg}</div></div>`;
            }

            flights.forEach(f => {
                const dep = f.departureAirport || '';
                const arr = f.arrivalAirport || '';
                const depTime = formatTimeISO(f.departureTime || '');
                const arrTime = formatTimeISO(f.arrivalTime || '');
                const blockMins = f.departureTime && f.arrivalTime ? (new Date(f.arrivalTime) - new Date(f.departureTime)) / 60000 : null;
                const dhBadge = f.dh ? `<span class="ml-2 text-[9px] font-black text-pink-300">DH</span>` : '';
                const flightNum = f.flightNumber ? `<span class="text-[10px] text-blue-400/70 ml-2">${f.flightNumber}</span>` : '';
                let groundBadge = '';
                if (arr && f.arrivalTime && arr !== pilotBase) {
                    const nextLeg = segments.filter(s => s.type === 'flight' && s.departureAirport === arr && s.departureTime > f.arrivalTime)
                        .sort((a, b) => new Date(a.departureTime) - new Date(b.departureTime))[0];
                    if (nextLeg) {
                        const gm = (new Date(nextLeg.departureTime) - new Date(f.arrivalTime)) / 60000;
                        if (gm > 0) groundBadge = `<div class="text-amber-300 text-xs font-semibold mt-1">${gm < 240 ? 'Turn' : 'Layover'} ${formatDurationMinutes(gm)}</div>`;
                    }
                }
                html += `<div class="bg-black/40 border border-white/10 rounded-xl p-4 mb-3">
                    <div class="flex items-center justify-between mb-1">
                        <div class="text-lg font-black text-white">${dep} <span class="text-blue-500/60">→</span> ${arr}${dhBadge}</div>
                        ${flightNum}
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <div class="font-bold text-zinc-200">${depTime} <span class="text-zinc-600">→</span> ${arrTime}</div>
                        <div class="text-zinc-500">${blockMins !== null ? `Block ${formatDurationMinutes(blockMins)}` : ''}</div>
                    </div>
                    ${groundBadge}
                    ${f.tail ? `<div class="text-[10px] text-zinc-600 mt-1">${f.tail}</div>` : ''}
                </div>`;
            });

            document.getElementById('day-detail-content').innerHTML = html;
            document.getElementById('day-detail-sheet').classList.remove('hidden');
        }

        function changeMonth(dir) { viewDate.setMonth(viewDate.getMonth() + dir); render(); }

        async function handleMobileUpload(input) {
            if (!input.files[0]) return;
            const file = input.files[0];
            const uploadPilot = document.getElementById('mobile-upload-pilot-select').value;
            document.getElementById('mobile-upload-sheet').classList.add('hidden');
            const result = await uploadPilotSchedule(uploadPilot, file);
            if (result && result.success) {
                alert(`Uploaded ${result.segmentsAdded} segments for ${uploadPilot}`);
                if (uploadPilot === currentPilot) loadPilot(currentPilot);
            } else {
                alert('Upload failed. Check console for details.');
            }
            input.value = '';
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            // Set initial mobile nav active state
            const mbtn = document.getElementById('mbtn-grid');
            if (mbtn) mbtn.style.color = '#3b82f6';
            loadPilot('kyle');
        });
    </script>
