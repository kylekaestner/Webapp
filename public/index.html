<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dispatch | Crowded Skies</title>
    <script src="https://cdn.tailwindcss.com"></script>

        .view-section { display: none; height: calc(100vh - 80px); }
        .view-active { display: block; }
        .nav-active { border-color: #3b82f6 !important; color: white !important; background: rgba(59, 130, 246, 0.1); }
        #map { height: 100%; width: 100%; background: #0a0a0a; }
        .map-controls { position: absolute; top: 20px; right: 20px; z-index: 1000; }
        .flight-row:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; margin-bottom: 8px; }
        .day-past { opacity: 0.55; }
        .day-today { border-color: #38bdf8 !important; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3); }
        .day-today .day-number { color: #7dd3fc; }
    </style>
</head>
<body class="bg-[#050505] text-zinc-100 flex h-screen overflow-hidden font-sans">

    <div id="sidebar" class="w-64 border-r border-zinc-800 bg-zinc-900/20 flex flex-col shrink-0">
        <div class="p-6 border-b border-zinc-800 text-center">
            <h1 class="text-blue-500 font-black italic text-xl tracking-tighter uppercase">Crowded Skies</h1>
        </div>
        
        <div class="p-4 space-y-1">
            <p class="text-[10px] font-black text-zinc-600 uppercase px-2 mb-2">Navigation</p>
            <button onclick="switchView('grid')" id="btn-grid" class="nav-active w-full text-left p-3 rounded-xl border border-zinc-800 transition-all text-sm font-bold text-zinc-400 hover:text-white">📅 Calendar Grid</button>
            <button onclick="switchView('list')" id="btn-list" class="w-full text-left p-3 rounded-xl border border-zinc-800 transition-all text-sm font-bold text-zinc-400 hover:text-white">📜 List View</button>

        </div>

            <button onclick="loadPilot('kyle')" id="pilot-kyle" class="w-full text-left p-4 rounded-xl border border-zinc-800 hover:border-blue-500 transition-colors">
                <span class="text-[9px] block text-zinc-500 font-black uppercase">Kyle</span>
                <span class="font-bold text-sm tracking-tight">Kyle Kaestner</span>

            <button onclick="loadPilot('logan')" id="pilot-logan" class="w-full text-left p-4 rounded-xl border border-zinc-800 hover:border-blue-500 transition-colors">
                <span class="text-[9px] block text-zinc-500 font-black uppercase">Logan</span>
                <span class="font-bold text-sm tracking-tight">Logan Hine</span>
            </button>
        </div>

        <div class="mt-auto p-4 border-t border-zinc-800 bg-black/20 space-y-3">
            <div class="space-y-2">
                <label class="text-[10px] font-black text-zinc-600 uppercase px-2 block">Upload For</label>
                <select id="upload-pilot-select" class="w-full p-2 rounded-lg border border-zinc-700 bg-zinc-900 text-sm font-bold text-zinc-100 hover:border-blue-500 transition">
                    <option value="kyle">Kyle Kaestner</option>
                    <option value="adam">Adam Burke</option>
                    <option value="sam">Sam Byrne</option>
                    <option value="logan">Logan Hine</option>

    <div class="flex-1 flex flex-col overflow-hidden">

            'LGA': [40.7769, -73.8740], 'KLGA': [40.7769, -73.8740],

        // Authoritative airport DB (populated from OpenFlights or OurAirports)
        const AIRPORT_DB = { byIata: {}, byIcao: {} };

        // Try fetching the OpenFlights airports.dat and populate AIRPORT_DB.
        function loadAirportDB() {
            const url = 'https://raw.githubusercontent.com/jpatokal/openflights/master/data/airports.dat';
            fetch(url).then(r => {
                if (!r.ok) throw new Error('Failed to fetch airports.dat');
                return r.text();
            }).then(txt => {
                const lines = txt.split(/\r?\n/);
                lines.forEach(line => {
                    if (!line) return;
                    // fields are CSV with quoted strings — split on "," conservatively
                    const parts = line.split(',');
                    // parts: 0:id 1:name 2:city 3:country 4:iata 5:icao 6:lat 7:lon ...
                    if (parts.length < 8) return;
                    const iata = parts[4] ? parts[4].replace(/^"|"$/g, '').trim() : '';
                    const icao = parts[5] ? parts[5].replace(/^"|"$/g, '').trim() : '';
                    const lat = parseFloat(parts[6] ? parts[6].replace(/^"|"$/g, '') : NaN);
                    const lon = parseFloat(parts[7] ? parts[7].replace(/^"|"$/g, '') : NaN);
                    if (!isFinite(lat) || !isFinite(lon)) return;
                    if (iata && iata !== '\\N') AIRPORT_DB.byIata[iata.toUpperCase()] = [lat, lon];
                    if (icao && icao !== '\\N') AIRPORT_DB.byIcao[icao.toUpperCase()] = [lat, lon];
                });
                // Merge a few authoritative matches into AIRPORTS for immediate lookup
                Object.keys(AIRPORT_DB.byIata).forEach(k => { if (!AIRPORTS[k]) AIRPORTS[k] = AIRPORT_DB.byIata[k]; });
                Object.keys(AIRPORT_DB.byIcao).forEach(k => { if (!AIRPORTS[k]) AIRPORTS[k] = AIRPORT_DB.byIcao[k]; });
                console.log('Loaded airport DB entries:', Object.keys(AIRPORT_DB.byIata).length, Object.keys(AIRPORT_DB.byIcao).length);
            }).catch(err => console.warn('Airport DB load failed', err));
        }

        // Kick off loading but don't block rendering. Local AIRPORTS remains a fallback.
        loadAirportDB();

        function resolveAirport(code) {
            if (!code) return null;
            const upper = code.toUpperCase();
            // direct match in explicit table
            if (AIRPORTS[upper]) return AIRPORTS[upper];
            // check authoritative DB (prefer ICAO then IATA)
            if (AIRPORT_DB.byIcao[upper]) return AIRPORT_DB.byIcao[upper];
            if (AIRPORT_DB.byIata[upper]) return AIRPORT_DB.byIata[upper];
            // tolerate 4-letter ICAO where the last 3 are IATA
            if (upper.length === 4) {
                const last3 = upper.slice(-3);
                if (AIRPORTS[last3]) return AIRPORTS[last3];
                if (AIRPORT_DB.byIata[last3]) return AIRPORT_DB.byIata[last3];
            }
            // accept 3-letter IATA by trying common K-prefixes (US)
            if (upper.length === 3) {
                const kpref = 'K' + upper;
                if (AIRPORTS[kpref]) return AIRPORTS[kpref];
                if (AIRPORT_DB.byIcao[kpref]) return AIRPORT_DB.byIcao[kpref];
            }
            // final attempt: strip any leading non-alphanum and retry
            const stripped = upper.replace(/[^A-Z0-9]/g, '');
            if (stripped !== upper) return resolveAirport(stripped);
            return null;
        }

        function getPilotStorageKey(pilot) {
            return `pilot-schedule-${pilot}`;

        // Fetch pilot data from server
        async function fetchPilotData(pilot) {

        function sortSegmentsByTime(segList) {
            return segList.slice().sort((a, b) => {
                const aTime = a.departureTime ? Date.parse(a.departureTime) : Infinity;
                const bTime = b.departureTime ? Date.parse(b.departureTime) : Infinity;
                if (aTime !== bTime) return aTime - bTime;
                const aEnd = a.arrivalTime ? Date.parse(a.arrivalTime) : Infinity;
                const bEnd = b.arrivalTime ? Date.parse(b.arrivalTime) : Infinity;
                if (aEnd !== bEnd) return aEnd - bEnd;
                return (a.type || '').localeCompare(b.type || '');
            });
        }

        function inferAwayLayovers(segList, base) {
            const sorted = sortSegmentsByTime(segList);
            const awayEvents = [];
            const flights = sorted.filter(s => s.type === 'flight' && s.departureTime && s.arrivalTime);
            
            for (let i = 0; i < flights.length - 1; i++) {
                const current = flights[i];
                const next = flights[i + 1];
                
                if (!current.arrivalAirport) continue;
                // Skip if arriving at base (no layover away from base)
                if (base && current.arrivalAirport === base) continue;
                if (!next.departureTime) continue;

                try {
                    let arrDate = new Date(current.arrivalTime.replace('Z', ''));
                    let depDate = new Date(next.departureTime.replace('Z', ''));
                    
                    if (isNaN(arrDate.getTime()) || isNaN(depDate.getTime())) continue;
                    
                    arrDate.setHours(0, 0, 0, 0);
                    depDate.setHours(0, 0, 0, 0);
                    const day = new Date(arrDate);
                    day.setDate(day.getDate() + 1);

                    while (day < depDate) {
                        const y = day.getFullYear(), m = String(day.getMonth() + 1).padStart(2, '0'), d = String(day.getDate()).padStart(2, '0');
                        awayEvents.push({ type: 'away', departureTime: `${y}-${m}-${d}T00:00:00`, arrivalAirport: current.arrivalAirport });
                        day.setDate(day.getDate() + 1);
                    }
                } catch (err) {
                    console.error('Error inferring away layover:', err, current, next);
                    continue;
                }
            }
            return sortSegmentsByTime([...sorted, ...awayEvents]);
        }

        function loadPilot(pilot) {

            // Fetch from server
            fetchPilotData(pilot).then((data) => {
                if (!data) {

                    return;

                // Convert database format to segment format
                let segmentData = [];
                if (data.segments && Array.isArray(data.segments)) {
                    segmentData = data.segments.map(seg => ({
                        type: seg.type,
                        departureTime: seg.departure_time,
                        arrivalTime: seg.arrival_time,
                        departureAirport: seg.departure_airport,
                        arrivalAirport: seg.arrival_airport,
                        tail: seg.tail || '',
                        trip: seg.trip || '',
                        flightNumber: seg.flight_number || '',
                        dh: seg.is_dh ? true : false
                    }));
                }

                // Cache pilot data for use in render()
                pilotsCache[pilot] = data;

                const pilotBase = data.base || null;
                console.log(`Loading pilot ${pilot}, base: ${pilotBase}, segments: ${segmentData.length}`);
                segments = inferAwayLayovers(segmentData || [], pilotBase);
                document.getElementById('pilot-header').textContent = data.name || pilot;
                render();
            });
        }

        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false }).setView([39.8283, -98.5795], 4);

        function toRadians(deg) { return deg * Math.PI / 180; }
        function toDegrees(rad) { return rad * 180 / Math.PI; }
        function greatCircleArcCoords(start, end, steps = 64) {
            const [lat1, lon1] = start.map(toRadians);
            const [lat2, lon2] = end.map(toRadians);
            const dLon = lon2 - lon1;
            const cosDelta = Math.sin(lat1) * Math.sin(lat2) + Math.cos(lat1) * Math.cos(lat2) * Math.cos(dLon);
            const delta = Math.acos(Math.min(1, Math.max(-1, cosDelta)));
            if (delta === 0) return [[start[0], start[1]], [end[0], end[1]]];
            const path = [];
            for (let i = 0; i <= steps; i++) {
                const f = i / steps;
                const A = Math.sin((1 - f) * delta) / Math.sin(delta);
                const B = Math.sin(f * delta) / Math.sin(delta);
                const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
                const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
                const z = A * Math.sin(lat1) + B * Math.sin(lat2);
                const lat = Math.atan2(z, Math.sqrt(x * x + y * y));
                const lon = Math.atan2(y, x);
                path.push([toDegrees(lat), toDegrees(lon)]);
            }
            return path;
        }

        function renderMap() {
            if (!map) return;
            mapLayers.past.forEach(l => map.removeLayer(l));
            mapLayers.future.forEach(l => map.removeLayer(l));
            mapLayers.airports.forEach(l => map.removeLayer(l));
            mapLayers.labels.forEach(l => map.removeLayer(l));
            mapLayers = { past: [], future: [], airports: [], labels: [] };

            const now = new Date();
            const bounds = [];
            const airportSet = new Set();

            segments.filter(s => s.type === 'flight').forEach(f => {
                const depCoords = resolveAirport(f.departureAirport);
                const arrCoords = resolveAirport(f.arrivalAirport);
                if (!depCoords || !arrCoords) return;
                const isPast = new Date(f.departureTime) < now;
                const color = isPast ? '#6b7280' : '#3b82f6';
                const weight = isPast ? 1.5 : 2.8;
                const line = L.polyline(greatCircleArcCoords(depCoords, arrCoords, 60), {
                    weight: weight, opacity: 0.95, color: color, smoothFactor: 1
                });

                if (isPast) mapLayers.past.push(line);
                else mapLayers.future.push(line);

                if ((isPast && showPast) || (!isPast && showFuture)) line.addTo(map);

                [f.departureAirport, f.arrivalAirport].forEach(code => {
                    const upperCode = code ? code.toUpperCase() : '';
                    const coords = resolveAirport(upperCode);
                    if (!upperCode || airportSet.has(upperCode) || !coords) return;
                    airportSet.add(upperCode);
                    bounds.push(coords);
                    const point = L.circleMarker(coords, {
                        radius: 5,
                        color: '#f8fafc',
                        fillColor: '#f8fafc',
                        fillOpacity: 1,
                        weight: 1
                    });
                    point.addTo(map);
                    mapLayers.airports.push(point);

                    const label = L.marker(coords, {
                        icon: L.divIcon({
                            className: 'airport-label',
                            html: `<div style="color:#f8fafc;font-size:11px;font-weight:800;text-shadow:0 0 12px rgba(0,0,0,0.8);transform: translate(-50%, -150%);">${code}</div>`,
                            iconAnchor: [0, 0],
                            popupAnchor: [0, -15]
                        })
                    });
                    label.addTo(map);
                    mapLayers.labels.push(label);
                });
            });

            if (bounds.length > 0) {
                const boundsLayer = L.latLngBounds(bounds);
                map.fitBounds(boundsLayer.pad(0.2));
            }
        }

        function formatTimeISO(iso) {
            if (!iso) return '—';
            try {
                // Handle both formats: with Z (UTC) and without
                let dateStr = iso.replace('Z', '');
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return '—';
                return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return '—';
            }
        }
        function formatDurationMinutes(mins) {
            if (mins <= 0 || !isFinite(mins)) return '—';
            const h = Math.floor(mins / 60); const m = Math.round(mins % 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        function attachTooltips() {
            document.querySelectorAll('.flight-item').forEach(el => {
                function onEnter(e) {
                    const dep = el.dataset.depTime; const arr = el.dataset.arrTime; const tail = el.dataset.tail || '—'; const trip = el.dataset.trip || ''; const flightNum = el.dataset.flight || '';
                    const depApt = el.dataset.depApt || '';
                    const arrApt = el.dataset.arrApt || '';
                    const depDate = dep ? new Date(dep.replace('Z', '')) : null;
                    const arrDate = arr ? new Date(arr.replace('Z', '')) : null;
                    const blockMins = (depDate && arrDate && !isNaN(depDate.getTime()) && !isNaN(arrDate.getTime())) ? (arrDate - depDate) / 60000 : null;

                    // compute layover to next flight in segments
                    let layoverText = '';
                    try {
                        const curArr = arrDate;
                        if (curArr) {
                            const next = segments.filter(s => s.type === 'flight' && s.departureTime).map(s => ({...s, _d: new Date(s.departureTime)})).filter(s=>s._d>curArr).sort((a,b)=>a._d-b._d)[0];
                            if (next) {
                                const mins = (new Date(next.departureTime) - curArr) / 60000;
                                layoverText = `Layover to next (${next.departureAirport}→${next.arrivalAirport}): ${formatDurationMinutes(mins)}`;
                            }
                        }
                    } catch (er) { layoverText = ''; }

                    const dhLabel = el.dataset.dh === 'true' ? `<div style="font-size:11px;color:#f9a8d4;font-weight:700;margin-bottom:4px">DH Flight</div>` : '';
                    const html = `<div style="font-weight:800;margin-bottom:6px">${depApt} → ${arrApt} ${flightNum ? `<span style=\"font-weight:600;color:#9fb8ff;margin-left:6px\">${flightNum}</span>` : (trip ? `<span style=\"font-weight:600;color:#9fb8ff;margin-left:6px\">Trip ${trip}</span>` : '')}</div>` +
                        dhLabel +
                        `<div style="font-size:12px;color:#cbd5e1">Dep: ${formatTimeISO(dep)} • Arr: ${formatTimeISO(arr)}</div>` +
                        `<div style="font-size:12px;color:#cbd5e1">Block: ${formatDurationMinutes(blockMins)}</div>` +
                        `<div style="font-size:12px;color:#cbd5e1">Tail: ${tail}</div>` +
                        (layoverText ? `<div style="margin-top:6px;color:#ffd57a;font-weight:700">${layoverText}</div>` : '');

                    showTooltip(html, e.clientX, e.clientY);
                }
                function onMove(e) { moveTooltip(e.clientX, e.clientY); }
                function onLeave() { hideTooltip(); }
                el.removeEventListener('mouseenter', el._enter);
                el.removeEventListener('mousemove', el._move);
                el.removeEventListener('mouseleave', el._leave);
                el._enter = onEnter; el._move = onMove; el._leave = onLeave;
                el.addEventListener('mouseenter', onEnter);
                el.addEventListener('mousemove', onMove);
                el.addEventListener('mouseleave', onLeave);
            });
        }

        // --- Parsers (client-side) ---
        function parseICS(text) {
            const events = [];
            const blocks = text.split(/BEGIN:VEVENT/gi).slice(1);
            for (const b of blocks) {
                const lines = b.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                const getLine = (prefix) => {
                    const ln = lines.find(l => l.toUpperCase().startsWith(prefix));
                    return ln ? ln.split(/:(.+)/)[1] || '' : '';
                };
                const rawDTSTART = lines.find(l => l.toUpperCase().startsWith('DTSTART')) || '';
                const isAllDay = /VALUE=DATE/i.test(rawDTSTART);
                const dtstart = rawDTSTART.split(/:(.+)/)[1] || '';
                const dtend = (lines.find(l => l.toUpperCase().startsWith('DTEND')) || '').split(/:(.+)/)[1] || '';
                const summary = getLine('SUMMARY') || '';
                const desc = getLine('DESCRIPTION') || '';

                if (/^HARD$/i.test(summary) || isAllDay) {
                    // hard day off
                    const date = isAllDay ? dtstart : dtstart.substring(0,8);
                    const y = date.substring(0,4), m = date.substring(4,6), d = date.substring(6,8);
                    events.push({ type: 'hard', departureTime: `${y}-${m}-${d}T00:00:00` });
                    continue;
                }

                if (/^AWAY$/i.test(summary)) {
                    // away with DESCRIPTION maybe 'AWAY - APC'
                    const arrival = (desc.match(/AWAY\s*-\s*(\w+)/i) || [])[1] || null;
                    if (dtstart) {
                        const isoStart = formatICSDatetime(dtstart);
                        const isoEnd = dtend ? formatICSDatetime(dtend) : '';
                        events.push({ type: 'away', departureTime: isoStart, arrivalTime: isoEnd, arrivalAirport: arrival });
                    }
                    continue;
                }

                // flight events: SUMMARY like '✈️ KSUS -> TJSJ' or '✈️ KCNY -> KSUS'
                const flightMatch = summary.match(/(?:✈️|\u2708)?\s*([A-Z0-9]{3,4})\s*(?:->|→|–|—|-|to)\s*([A-Z0-9]{3,4})/i);
                const tailMatch = desc.match(/Tail:\s*(\S+)/i);
                const tripMatch = desc.match(/Trip\s*[:#]?\s*(\d+)/i);
                // try to capture flight number like RPA1234 or SKW567
                const flightNumMatch = desc.match(/(?:Flight|Flt|FLT)\s*[:#]?\s*([A-Z]{2,3}\d{1,4})/i) || desc.match(/\b([A-Z]{2,3}\d{1,4})\b/i);
                if (flightMatch) {
                    const dep = flightMatch[1];
                    const arr = flightMatch[2];
                    const isoStart = dtstart ? formatICSDatetime(dtstart) : '';
                    const isoEnd = dtend ? formatICSDatetime(dtend) : '';
                    events.push({
                        type: 'flight',
                        departureTime: isoStart,
                        arrivalTime: isoEnd,
                        departureAirport: dep,
                        arrivalAirport: arr,
                        tail: tailMatch ? tailMatch[1] : '',
                        trip: tripMatch ? tripMatch[1] : '',
                        flightNumber: (flightNumMatch && flightNumMatch[1] && !/^N/i.test(flightNumMatch[1])) ? flightNumMatch[1].toUpperCase() : ''
                    });
                }
            }
            return events;
        }

        function formatICSDatetime(s) {
            // s like 20260430T120000Z or 20260501
            if (/^\d{8}T\d{6}Z$/.test(s)) {
                const y = s.substring(0,4), m = s.substring(4,6), d = s.substring(6,8);
                const hh = s.substring(9,11), mm = s.substring(11,13), ss = s.substring(13,15);
                return `${y}-${m}-${d}T${hh}:${mm}:${ss}Z`;
            }
            if (/^\d{8}$/.test(s)) {
                const y = s.substring(0,4), m = s.substring(4,6), d = s.substring(6,8);
                return `${y}-${m}-${d}T00:00:00`;
            }
            return s;
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            const header = lines.shift().split(',').map(h => h.trim());
            const idx = (name) => header.indexOf(name);
            const events = [];

            const toMinutes = (time) => {
                const txt = normalizeTime(time);
                const [hh, mm] = txt.split(':').map(Number);
                return hh * 60 + mm;
            };

            const addDays = (year, month, day, extraDays) => {
                const d = new Date(Number(year), Number(month) - 1, Number(day) + extraDays);
                const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
                return { y, m, dd };
            };

            for (const row of lines) {
                const cols = row.split(',');
                const date = cols[idx('DATE')]?.trim();
                const dh = cols[idx('DH')]?.trim();
                const tail = (cols[idx('FCVTAIL')] || cols[idx('TAIL')] || '').trim();
                const dep = (cols[idx('DEP')] || '').trim();
                const arr = (cols[idx('ARR')] || '').trim();
                const deptime = (cols[idx('DEPTIME')] || '').trim();
                const arrtime = (cols[idx('ARRTIME')] || '').trim();

                if (!date) continue;
                const [m, d, y] = date.split('/');
                const ym = y.padStart(4, '0'), mm = m.padStart(2, '0'), dd = d.padStart(2, '0');

                if (dep && arr) {
                    const dt = normalizeTime(deptime);
                    const at = normalizeTime(arrtime);
                    let arrivalDate = { y: ym, m: mm, dd: dd };
                    const depMinutes = toMinutes(deptime);
                    const arrMinutes = toMinutes(arrtime);
                    if (arrMinutes <= depMinutes) {
                        arrivalDate = addDays(ym, mm, dd, 1);
                    }
                    const isoStart = `${ym}-${mm}-${dd}T${dt}:00`;
                    const isoEnd = `${arrivalDate.y}-${arrivalDate.m}-${arrivalDate.dd}T${at}:00`;
                    const isDH = dh && dh.toUpperCase() === 'DH';
                    events.push({ type: 'flight', departureTime: isoStart, arrivalTime: isoEnd, departureAirport: dep, arrivalAirport: arr, tail, dh: isDH });
                    continue;
                }

                if (dh && dh.toUpperCase() === 'DH') {
                    const isoDate = `${ym}-${mm}-${dd}T00:00:00`;
                    events.push({ type: 'hard', departureTime: isoDate });
                    continue;
                }
            }
            return events;
        }

        // Flexible CSV parser variant for SkyWest-style exports (handles varied header names)
        function parseCSV_skywest(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            if (lines.length === 0) return [];
            const headerRaw = lines.shift();
            const header = headerRaw.split(',').map(h => h.trim().toUpperCase());

            const findIdx = (aliases) => {
                for (const a of aliases) {
                    const up = a.toUpperCase();
                    const i = header.indexOf(up);
                    if (i >= 0) return i;
                }
                return -1;
            };

            const idxDate = findIdx(['DATE','FLIGHTDATE','SCHEDULEDATE']);
            const idxDep = findIdx(['DEP','DEPARTURE','ORIG','ORIGIN','FROM']);
            const idxArr = findIdx(['ARR','ARRIVAL','DEST','DESTINATION','TO']);
            const idxDepTime = findIdx(['DEPTIME','DEP_TIME','DEPARTURETIME','DEP TIME','DEP/TIME','DEPT']);
            const idxArrTime = findIdx(['ARRTIME','ARR_TIME','ARRIVALTIME','ARR TIME','ARR/TIME','ARRT']);
            const idxTail = findIdx(['FCVTAIL','TAIL','AIRCRAFT','REGISTRATION']);
            const idxDh = findIdx(['DH','DUTY','IS_DH']);

            const events = [];

            const toMinutes = (time) => {
                if (!time) return 0;
                const norm = normalizeTime(time.replace(/"/g, '').trim());
                const [hh, mm] = norm.split(':').map(Number);
                return hh * 60 + mm;
            };

            const addDays = (year, month, day, extraDays) => {
                const d = new Date(Number(year), Number(month) - 1, Number(day) + extraDays);
                const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
                return { y, m, dd };
            };

            for (const row of lines) {
                const cols = row.split(',');
                const date = idxDate >= 0 ? (cols[idxDate] || '').replace(/"/g,'').trim() : '';
                const dep = idxDep >= 0 ? (cols[idxDep] || '').replace(/"/g,'').trim() : '';
                const arr = idxArr >= 0 ? (cols[idxArr] || '').replace(/"/g,'').trim() : '';
                const deptime = idxDepTime >= 0 ? (cols[idxDepTime] || '').replace(/"/g,'').trim() : '';
                const arrtime = idxArrTime >= 0 ? (cols[idxArrTime] || '').replace(/"/g,'').trim() : '';
                const tail = idxTail >= 0 ? (cols[idxTail] || '').replace(/"/g,'').trim() : '';
                const dh = idxDh >= 0 ? (cols[idxDh] || '').replace(/"/g,'').trim() : '';

                if (!date) continue;

                // Accept formats like MM/DD/YYYY or YYYY-MM-DD
                let ym = '', mm = '', dd = '';
                if (/\d{1,2}\/\d{1,2}\/\d{2,4}/.test(date)) {
                    const parts = date.split('/');
                    mm = String(parts[0]).padStart(2,'0'); dd = String(parts[1]).padStart(2,'0'); ym = String(parts[2]).padStart(4,'0');
                } else if (/\d{4}-\d{2}-\d{2}/.test(date)) {
                    const parts = date.split('-'); ym = parts[0]; mm = parts[1]; dd = parts[2];
                } else {
                    // fallback: try to parse with Date
                    const d = new Date(date);
                    if (isNaN(d)) continue;
                    ym = d.getFullYear(); mm = String(d.getMonth()+1).padStart(2,'0'); dd = String(d.getDate()).padStart(2,'0');
                }

                if (dep && arr) {
                    const dt = normalizeTime(deptime);
                    const at = normalizeTime(arrtime);
                    let arrivalDate = { y: ym, m: mm, dd: dd };
                    const depMinutes = toMinutes(deptime);
                    const arrMinutes = toMinutes(arrtime);
                    if (arrMinutes <= depMinutes) arrivalDate = addDays(ym, mm, dd, 1);
                    const isoStart = `${ym}-${mm}-${dd}T${dt}:00`;
                    const isoEnd = `${arrivalDate.y}-${arrivalDate.m}-${arrivalDate.dd}T${at}:00`;
                    const isDH = dh && (dh.toUpperCase() === 'DH' || dh === '1' || dh.toLowerCase() === 'true');
                    events.push({ type: 'flight', departureTime: isoStart, arrivalTime: isoEnd, departureAirport: dep, arrivalAirport: arr, tail, dh: isDH });
                    continue;
                }

                if (dh && dh.toUpperCase() === 'DH') {
                    const isoDate = `${ym}-${mm}-${dd}T00:00:00`;
                    events.push({ type: 'hard', departureTime: isoDate });
                    continue;
                }
            }

            return events;
        }

        function normalizeTime(t) {
            if (!t) return '00:00';
            const txt = t.trim().replace(/[^\d:]/g, '');
            if (txt.includes(':')) {
                const parts = txt.split(':');
                const hh = String(parts[0] || '00').padStart(2, '0').slice(-2);
                const mm = String(parts[1] || '00').padStart(2, '0').slice(-2);
                return `${hh}:${mm}`;
            }
            const s = txt.padStart(4, '0');
            return `${s.slice(0, 2)}:${s.slice(2, 4)}`;
        }

        async function handleUpload(input) {
            if (!input.files[0]) return;
            
            const file = input.files[0];
            // Get selected pilot from dropdown
            const uploadPilot = document.getElementById('upload-pilot-select').value;
            
            console.log(`Uploading ${file.name} for pilot ${uploadPilot}...`);
            
            const result = await uploadPilotSchedule(uploadPilot, file);
            
            if (result && result.success) {
                alert(`Successfully uploaded ${result.segmentsAdded} segments for ${uploadPilot}`);
                // If the uploaded pilot is currently viewed, reload their data
                if (uploadPilot === currentPilot) {
                    loadPilot(currentPilot);
                }
            } else {
                alert('Upload failed. Check console for details.');
            }
            
            // Reset input
            input.value = '';
        }

        function changeMonth(dir) { viewDate.setMonth(viewDate.getMonth() + dir); render(); }
        
        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadPilot('kyle');
        });
    </script>
